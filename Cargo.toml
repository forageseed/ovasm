[package]
name = "ovasm"
version = "0.1.1"
edition = "2021"
description = "OrganelleVerse organelle assembler: read recruitment, evidence graphs, assembly"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "ovasm"
path = "src/main.rs"

[dependencies]
# Pure-Rust gzip only (no bzip2/xz/zstd C libraries) so Windows builds need no system toolchain.
needletail = { version = "0.6", default-features = false, features = ["flate2"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
crossbeam-channel = "0.5"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
